# ruminate: 復習問題の Issue に答えがコメントされたら、その場で採点する。
# このファイルを ruminate-data の .github/workflows/ に置く。
#
# 認証は Workload Identity Federation。リポジトリに静的な鍵は置かず、
# GitHub Actions の OIDC トークンを Anthropic の短命トークンに交換する。
# 準備は templates/ruminate-data/README.md を参照。ID は秘密ではないので
# リポジトリの variables（secrets ではない）に入れる:
#   ANTHROPIC_FEDERATION_RULE_ID   fdrl_...
#   ANTHROPIC_ORGANIZATION_ID      組織の UUID
#   ANTHROPIC_SERVICE_ACCOUNT_ID   svac_...
#   ANTHROPIC_WORKSPACE_ID         wrkspc_...
# federation rule の subject は repo:<owner>/ruminate-data:ref:refs/heads/main。
# issue_comment のワークフローは main の文脈で走るので、これだけで通る。
# ANTHROPIC_API_KEY を secret に置いてはいけない。あると federation より優先される。
name: ruminate review

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  id-token: write   # GitHub の OIDC トークンを取るのに必要

jobs:
  grade:
    # 復習の Issue へのコメントだけ。Claude 自身のコメントには反応しない。
    if: >-
      contains(github.event.issue.labels.*.name, 'ruminate-review') &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      !startsWith(github.event.comment.body, '採点:')
    runs-on: ubuntu-latest
    concurrency:
      group: ruminate-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          claude_args: "--allowedTools Bash,Read,Edit,Write"
          prompt: |
            あなたは ruminate の採点係です。Issue #${{ github.event.issue.number }}
            に本人が答えをコメントしました。採点して講評を書き、記録して Issue を閉じてください。
            本人に質問はしません。`logs/` には触りません。日付は JST（UTC+9）です。

            ## 1. 出した問題を読む

            `review/items.jsonl` の、`issue` が ${{ github.event.issue.number }} の行が今回の問題です。
            `question` が問い、`answer` が模範解答、`id` が問題の ID です。
            `review/history.jsonl` にこの Issue 番号の行がすでにあれば、採点済みなので
            「採点済みです」とだけコメントして終わります。

            ## 2. 本人の答えを読む

            本人のコメント（`gh issue view ${{ github.event.issue.number }} --comments`）から、
            番号付きの答えを読みます。Bot のコメントと「採点:」で始まるコメントは無視します。
            同じ番号に複数の答えがあれば最後のものを使います。

            ## 3. 採点する

            問題ごとに本人の答えを模範解答と照らします。

            - ○: 答えの核心（なぜそうなるか、何と何が違うか）を自分の言葉で押さえている。
              言い回しや細部の違いは問わない
            - ×: 核心が違う、核心に触れていない、または「○」「わからない」のような一言だけで
              説明がない。自己採点だけ書いてあっても説明がなければ ×
            - 未回答: その番号への答えがない

            甘く付けません。核心が抜けていれば × にして、何が抜けたかを講評で伝えます。

            ## 4. 記録する

            - ○: `review/history.jsonl` に
              {"date":"<今日 JST>","item":"<id>","result":"correct","issue":${{ github.event.issue.number }}}
              を追記。`items.jsonl` のその行の `correct` を 1 増やし、`stage` を 1 つ進め、
              `next_due` を stage に合わせる（1: 翌日、2: 7 日後、3: 30 日後、4: 出さない）
            - ×: `result` は `wrong`。`wrong` を 1 増やし、`stage` を 1、`next_due` を翌日にする
            - 未回答: `result` は `unanswered`。`items.jsonl` は変えない

            `items.jsonl` は 1 行 1 問の JSON で、該当行だけ書き換えます。ほかの行と列は
            そのまま残します。

            ## 5. 講評をコメントして閉じる

            コメントは「採点:」で始めます（この Action が自分のコメントに反応しないため）。
            問題ごとに 1〜2 文。○ なら何が押さえられていたか、× なら何が抜けていたか・
            どう違うかを、模範解答を引きながら書きます。責めず、次に思い出せる言い方にします。
            未回答の問題は「未回答。今夜もう一度出します」と書きます。

            形:

                採点: ○ 2 / × 1

                1. ○ Conscrypt APEX を見ないという核心が書けています。
                2. × 「別プロセス」までは合っていますが、人間が承認ダイアログに直接答えられる点が抜けています。
                3. ○ 追跡設定まで自動になる、で正解です。

            `gh issue close ${{ github.event.issue.number }} --body-file <講評のファイル>` で閉じます。

            ## 6. push する

                git add review
                git -c user.name=ruminate-review -c user.email=ruminate-review@users.noreply.github.com \
                    commit -q -m "ruminate: grade issue #${{ github.event.issue.number }}"
                git pull -q --rebase origin main
                git push -q origin HEAD:main
