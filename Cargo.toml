[package]
name = "ruminate"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keep your conversations with AI agents, and come back to them"
repository = "https://github.com/futabooo/ruminate"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
